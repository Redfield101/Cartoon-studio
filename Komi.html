<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOMI Cartoon Studio</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #07070b;
  color: #f4f2f8;
  font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
}

button {
  font: inherit;
}

.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 190px 1fr 250px;
  grid-template-rows: 64px 1fr 260px;
}

/* SIDEBAR */

.sidebar {
  grid-row: 1 / 4;
  border-right: 1px solid #24232d;
  padding: 22px 14px;
  background: #0b0b11;
}

.logo {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 35px;
}

.logo span {
  color: #9b5cff;
}

.nav-title {
  color: #686675;
  font-size: 11px;
  margin: 22px 10px 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nav button {
  width: 100%;
  border: 0;
  background: transparent;
  color: #aaa8b5;
  padding: 11px;
  text-align: left;
  border-radius: 8px;
  margin-bottom: 3px;
}

.nav button.active,
.nav button:hover {
  background: #24173d;
  color: white;
}

/* TOP BAR */

.topbar {
  grid-column: 2 / 4;
  border-bottom: 1px solid #24232d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  background: #0b0b11;
}

.project {
  font-weight: 600;
}

.status {
  color: #63e6a1;
  font-size: 12px;
}

.top-actions button {
  border: 1px solid #302e3a;
  background: #111119;
  color: white;
  padding: 9px 14px;
  border-radius: 8px;
  margin-left: 7px;
}

.export {
  background: #7c3aed !important;
  border-color: #7c3aed !important;
}

/* WORKSPACE */

.workspace {
  grid-column: 2;
  padding: 18px;
  background: #09090e;
}

.toolbar {
  display: flex;
  gap: 7px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.tool {
  background: #111119;
  border: 1px solid #2b2935;
  color: #c6c3ce;
  padding: 8px 12px;
  border-radius: 7px;
}

.tool.active {
  background: #32185d;
  border-color: #8b5cf6;
  color: white;
}

.canvas-area {
  height: calc(100% - 55px);
  min-height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    linear-gradient(45deg,#101016 25%,transparent 25%),
    linear-gradient(-45deg,#101016 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#101016 75%),
    linear-gradient(-45deg,transparent 75%,#101016 75%);
  background-size: 25px 25px;
  border: 1px solid #25232d;
  border-radius: 10px;
}

#canvas {
  background: white;
  max-width: 90%;
  max-height: 90%;
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  touch-action: none;
}

/* RIGHT PANEL */

.right {
  grid-column: 3;
  border-left: 1px solid #24232d;
  background: #0b0b11;
  padding: 16px;
}

.panel {
  border: 1px solid #282632;
  background: #101017;
  border-radius: 9px;
  padding: 14px;
  margin-bottom: 12px;
}

.panel h3 {
  margin: 0 0 14px;
  font-size: 13px;
}

.layer {
  padding: 10px;
  background: #191622;
  border-radius: 6px;
  margin-bottom: 5px;
  font-size: 12px;
}

.layer.active {
  background: #342052;
}

/* TIMELINE */

.timeline {
  grid-column: 2 / 4;
  border-top: 1px solid #282632;
  background: #0b0b11;
  padding: 12px 18px;
  overflow: hidden;
}

.timeline-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.track {
  height: 38px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #1e1d25;
}

.track-name {
  width: 100px;
  color: #85818f;
  font-size: 12px;
}

.frames {
  display: flex;
  gap: 4px;
}

.frame {
  width: 42px;
  height: 24px;
  background: #2a1a43;
  border: 1px solid #59348c;
  border-radius: 3px;
}

.frame.active {
  border-color: #c084fc;
  background: #6130a1;
}

/* LOCATION */

.location {
  border: 1px solid #3b2855;
  background: #160f22;
  padding: 12px;
  border-radius: 8px;
  font-size: 12px;
}

.location strong {
  display: block;
  color: #c084fc;
  margin-bottom: 5px;
}

#locationStatus {
  color: #8e8b99;
}

@media(max-width:900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto auto;
  }

  .sidebar,
  .right {
    display: none;
  }

  .topbar,
  .workspace,
  .timeline {
    grid-column: 1;
  }

  .canvas-area {
    min-height: 500px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">
<span>◆</span> KOMI
</div>

<div class="nav-title">Studio</div>

<div class="nav">
<button class="active">◈ Studio</button>
<button>▣ Projects</button>
<button>◇ Assets</button>
<button>♙ Characters</button>
<button>▤ Templates</button>
</div>

<div class="nav-title">Tools</div>

<div class="nav">
<button>✦ AI Assist</button>
<button>⌘ Learn</button>
</div>

</aside>


<!-- TOP BAR -->

<header class="topbar">

<div>
<div class="project">Classroom Scene</div>
<div class="status">● Auto-saved</div>
</div>

<div class="top-actions">
<button>Share</button>
<button class="export">Export</button>
</div>

</header>


<!-- WORKSPACE -->

<main class="workspace">

<div class="toolbar">

<button class="tool active" onclick="setTool('pen',this)">Pen</button>
<button class="tool" onclick="setTool('brush',this)">Brush</button>
<button class="tool" onclick="setTool('eraser',this)">Eraser</button>
<button class="tool" onclick="clearCanvas()">Clear</button>
<button class="tool" onclick="undo()">Undo</button>

<button class="tool" onclick="addFrame()">+ Frame</button>

</div>

<div class="canvas-area">

<canvas id="canvas" width="900" height="550"></canvas>

</div>

</main>


<!-- RIGHT PANEL -->

<aside class="right">

<div class="panel">

<h3>LAYERS</h3>

<div class="layer active">◉ Character</div>
<div class="layer">◉ Dialogue</div>
<div class="layer">◉ Background</div>
<div class="layer">◉ Camera</div>

</div>


<div class="panel">

<h3>SMART FEATURES</h3>

<div class="layer">✦ Auto Inbetween</div>
<div class="layer">〰 Line Smoothing</div>
<div class="layer">▦ Perspective Grid</div>
<div class="layer">◉ Color Assistant</div>

</div>


<div class="location">

<strong>LOCATION REQUIRED</strong>

<div id="locationStatus">
Location verification required.
</div>

<button class="tool" style="margin-top:10px"
onclick="requestLocation()">
Verify Location
</button>

</div>

</aside>


<!-- TIMELINE -->

<section class="timeline">

<div class="timeline-header">

<strong>ANIMATION TIMELINE</strong>

<span>24 FPS</span>

</div>

<div class="track">

<div class="track-name">Character</div>

<div class="frames" id="frames">

<div class="frame active"></div>
<div class="frame"></div>
<div class="frame"></div>
<div class="frame"></div>
<div class="frame"></div>

</div>

</div>

<div class="track">

<div class="track-name">Background</div>

<div class="frames">

<div class="frame"></div>
<div class="frame"></div>
<div class="frame"></div>

</div>

</div>

</section>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let tool = "pen";
let history = [];

ctx.lineCap = "round";
ctx.lineJoin = "round";

function saveState() {
  history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
}

function startDraw(e) {

  drawing = true;
  saveState();

  const rect = canvas.getBoundingClientRect();

  ctx.beginPath();

  ctx.moveTo(
    (e.clientX - rect.left) * canvas.width / rect.width,
    (e.clientY - rect.top) * canvas.height / rect.height
  );
}

function draw(e) {

  if(!drawing) return;

  const rect = canvas.getBoundingClientRect();

  const x =
    (e.clientX - rect.left) *
    canvas.width / rect.width;

  const y =
    (e.clientY - rect.top) *
    canvas.height / rect.height;

  ctx.lineWidth = tool === "brush" ? 10 : 3;

  if(tool === "eraser") {
    ctx.globalCompositeOperation = "destination-out";
  } else {
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "#111111";
  }

  ctx.lineTo(x,y);
  ctx.stroke();
}

function stopDraw() {
  drawing = false;
  ctx.globalCompositeOperation = "source-over";
}

canvas.addEventListener("pointerdown",startDraw);
canvas.addEventListener("pointermove",draw);
canvas.addEventListener("pointerup",stopDraw);
canvas.addEventListener("pointerleave",stopDraw);

function setTool(newTool,button) {

  tool = newTool;

  document.querySelectorAll(".tool")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");
}

function clearCanvas() {

  saveState();

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
}

function undo() {

  if(history.length === 0) return;

  const previous = history.pop();

  ctx.putImageData(previous,0,0);
}

function addFrame() {

  const frames = document.getElementById("frames");

  const frame = document.createElement("div");

  frame.className = "frame";

  frames.appendChild(frame);
}

function requestLocation() {

  const status =
    document.getElementById("locationStatus");

  if(!navigator.geolocation) {

    status.innerText =
      "Location is not supported on this device.";

    return;
  }

  status.innerText =
    "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(

    position => {

      status.innerText =
        "✓ Location verified. KOMI is ready.";

    },

    error => {

      status.innerText =
        "Location permission is required to use KOMI.";

    }
  );
}

</script>

</body>
</html>
